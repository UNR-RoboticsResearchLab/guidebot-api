services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: >-
        Server=db;Port=3306;Database=${MARIADB_DATABASE:-guidebot};
        User=${MARIADB_USER:-guidebot};Password=${MARIADB_PASSWORD:-guidebot};
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MARIADB_DATABASE:-guidebot}
      MARIADB_USER: ${MARIADB_USER:-guidebot}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-guidebot}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:
